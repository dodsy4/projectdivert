{% extends 'layouts/main.html' %}
{% block title %}Project Divert | Login{% endblock %}
{% block content %}
<style>
  .login-shell {
    max-width: 460px;
    margin: 24px auto 34px;
  }

  .login-card {
    background: #fff;
    border: 1px solid #d8e3ef;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(9, 36, 62, 0.08);
    overflow: hidden;
  }

  .login-head {
    background: linear-gradient(135deg, #0c6cae, #2f8fd4);
    color: #fff;
    padding: 18px;
  }

  .login-head h2 {
    margin: 0 0 6px;
    font-size: 28px;
  }

  .login-head p {
    margin: 0;
    opacity: 0.95;
  }

  .login-body {
    padding: 18px;
  }

  .login-body .form-group {
    margin-bottom: 12px;
  }

  .login-help {
    margin-top: 10px;
    font-size: 13px;
    color: #60758c;
  }

  .login-foot {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
</style>

<div class="login-shell">
  <div id="login" class="login-card">
    <div class="login-head">
      <h2>Login</h2>
      <p>Access your Project Divert account.</p>
    </div>

    <div class="login-body">
      <form method="post" action="/login">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="name@organization.org" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="login-help">Need an account? Use account setup below.</p>

      <div class="login-foot">
        <a href="/submit_details1" class="btn btn-default">Account Setup</a>
        <a href="/materials" class="btn btn-link">Back to Materials</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
