<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Divert | Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .row { margin-bottom: 10px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; }
    button { padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Carbon Calculator</h1>
    <div class="card">
      <form method="post" action="/output">
        <div class="row"><label>Material</label>{{ form.material() }}</div>
        <div class="row"><label>Amount</label>{{ form.city() }}</div>
        <div class="row"><label>Unit</label>{{ form.state() }}</div>
        <div class="row"><label>Site Address</label>{{ form.address() }}</div>
        <div class="row"><label>Traditional Address</label>{{ form.phone() }}</div>
        <div class="row"><label>Divert Address</label>{{ form.image_link() }}</div>
        <button type="submit">Calculate</button>
      </form>
    </div>
  </div>
</body>
</html>
