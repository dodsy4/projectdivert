name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      SQLALCHEMY_DATABASE_URI: sqlite:////tmp/projectdivert_pytest.db
      SESSION_COOKIE_SECURE: "0"
      SECRET_KEY: pytest-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile backend
        run: python -m compileall -q projectdivert config.py wsgi.py forms.py project_divert_lca.py

      - name: Run backend tests
        run: pytest -q tests

      - name: Check the LCA demo matches the engine
        run: |
          python scripts/build_lca_demo.py
          git diff --exit-code -- docs/lca-demo.html
          python scripts/verify_lca_demo.py

  mobile-typecheck:
    name: Mobile Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --include=dev

      - name: Run mobile typecheck
        run: npm run typecheck

  web-build:
    name: Web Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The demo switcher must be absent from a production build, not just
      # inert in one. A runtime guard inside the component looks identical in
      # review but still ships the code, so this reads the built output.
      - name: Assert no demo-only code in the production bundle
        run: npm run assert-no-demo-code
