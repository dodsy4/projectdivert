services:
  - type: web
    name: project-divert
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: DATABASE_URL
        fromDatabase:
          name: project-divert-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAIL_PROVIDER
        value: sendgrid
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: REQUEST_NOTIFICATION_EMAIL
        sync: false

databases:
  - name: project-divert-db
    plan: starter
